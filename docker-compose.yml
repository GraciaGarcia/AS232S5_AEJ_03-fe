version: "3.9"

services:
  frontend:
    container_name: gracia-frontend
    build:
      context: .
      dockerfile: Dockerfile
    image: 60071325/gracia-ia-frontend:latest
    environment:
      # URL del backend, se puede cambiar con variable de entorno si quieres
      VITE_API_URL: "${BACKEND_URL:-https://ubiquitous-barnacle-69gv6x755gjq3r9px-8086.app.github.dev/api/aiome}"
    ports:
      - "80:80"
    restart: always

# Endpoint del frontend:
# Una vez levantado, se puede abrir desde el navegador usando:
# http://localhost (si es local) o la URL pública de Codespaces / Docker host
